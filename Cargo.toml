[package]
name = "nl-macsec"
version = "0.1.0"
authors = ["Gris Ge <cnfourt@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Linux netlink library for MACsec management"
documentation = "https://docs.rs/nl-macsec"
repository = "https://github.com/rust-netlink/nl-macsec"
keywords = ["network", "macsec", "netlink"]
categories = ["network-programming", "os"]
readme = "README.md"

[lib]
name = "nl_macsec"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = ["tokio_socket"]
tokio_socket = ["netlink-proto/tokio_socket", "tokio"]
smol_socket = ["netlink-proto/smol_socket", "async-std"]

[[example]]
name = "configure"
required-features = ["tokio_socket"]

[[example]]
name = "multi_sa"
required-features = ["tokio_socket"]

[[example]]
name = "purge"
required-features = ["tokio_socket"]

[[example]]
name = "show"
required-features = ["tokio_socket"]

[dependencies]
async-std = { version = "1.13.0", optional = true }
futures-channel = "0.3.11"
futures-util = "0.3.11"
genetlink = { default-features = false, version = "0.3.0" }
log = "0.4.26"
netlink-packet-core = { version = "0.9.0" }
netlink-packet-generic = { version = "0.5.0" }
netlink-packet-macsec = { version = "0.1.0" }
netlink-proto = { default-features = false, version = "0.13.0" }
netlink-sys = { version = "0.9.0" }
tokio = { version = "1.44.0", features = ["rt"], optional = true }

[dev-dependencies]
env_logger = { version = "0.11.0", default-features = false }
pretty_assertions = "1.4.1"
tokio = { version = "1.9.0", features = ["macros", "rt-multi-thread"] }
